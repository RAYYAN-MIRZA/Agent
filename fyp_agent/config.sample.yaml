# FYP agent sample configuration.
#
# Copy to ~/.fyp-agent/config.yaml (Linux) or your user config path on Windows.
# Override any key with FYP_AGENT_* environment variables (see README).

# Must match the API base URL as seen from this host (no /api suffix).
# Local default for FYP.Api is port 5017 (see FYP.Backend launchSettings.json).
api_base_url: "http://localhost:5017"

# One-time enrollment token from:
#   curl -X POST http://localhost:5017/api/v1/agents/enrollments \
#        -H 'Content-Type: application/json' \
#        -d '{"label":"kali-lab","ttlHours":24}'
enrollment_token: "paste-token-here"

agent_name: "kali-lab"
capabilities:
  - nmap
  - raw_socket

heartbeat_interval_seconds: 30
verify_tls: false
log_level: "INFO"
